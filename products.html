<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samsung Phones</title>
  <link rel="stylesheet" href="style.css">

</head>

<body>

  <header class="site-header">
    <h1>Samsung Galaxy Phones</h1>
  </header>

  <main class="product-grid">
    <article class="card">
      <img class="card__image" src="https://placehold.co/300x200?text=Galaxy+S25+Ultra" alt="Samsung Galaxy S25 Ultra">
      <h2 class="card__name">Samsung Galaxy S25 Ultra</h2>
      <p class="card__price">R32 999</p>
      <button class="btn" type="button">Add to Cart</button>
    </article>

    <article class="card">
      <img class="card__image" src="https://placehold.co/300x200?text=Galaxy+S25" alt="Samsung Galaxy S25">
      <h2 class="card__name">Samsung Galaxy S25</h2>
      <p class="card__price">R19 999</p>
      <button class="btn" type="button">Add to Cart</button>
    </article>

    <article class="card">
      <img class="card__image" src="https://placehold.co/300x200?text=Galaxy+Z+Fold7" alt="Samsung Galaxy Z Fold7">
      <h2 class="card__name">Samsung Galaxy Z Fold7</h2>
      <p class="card__price">R44 999</p>
      <button class="btn" type="button">Add to Cart</button>
    </article>

    <article class="card">
      <img class="card__image" src="https://placehold.co/300x200?text=Galaxy+Z+Flip7" alt="Samsung Galaxy Z Flip7">
      <h2 class="card__name">Samsung Galaxy Z Flip7</h2>
      <p class="card__price">R24 999</p>
      <button class="btn" type="button">Add to Cart</button>
    </article>

    <article class="card">
      <img class="card__image" src="https://placehold.co/300x200?text=Galaxy+A56" alt="Samsung Galaxy A56">
      <h2 class="card__name">Samsung Galaxy A56</h2>
      <p class="card__price">R9 999</p>
      <button class="btn" type="button">Add to Cart</button>
    </article>

    <article class="card">
      <img class="card__image" src="https://placehold.co/300x200?text=Galaxy+A16" alt="Samsung Galaxy A16">
      <h2 class="card__name">Samsung Galaxy A16</h2>
      <p class="card__price">R3 799</p>
      <button class="btn" type="button">Add to Cart</button>

    </article>


  </main>


</body>


</html
