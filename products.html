<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samsung Phones</title>
  <link rel="stylesheet" href="style.css">

</head>

<body>

  <header class="site-header">
    <h1>Samsung Galaxy Phones</h1>
  </header>

  <main class="product-grid">
    <article class="card">
      <img class="card__image" src="https://www.incredible.co.za/api/catalog/product/s/m/sm_s938_galaxys25ultra_front_titaniumblack_ecommerce_0de1.png?width=808&height=538&store=incredibleconnection&image-type=image" alt="Samsung Galaxy S25 Ultra">
      <h2 class="card__name">Samsung Galaxy S25 Ultra</h2>
      <p class="card__price">R32 999</p>
      <button class="btn" type="button">Add to Cart</button>
    </article>

    <article class="card">
      <img class="card__image" src="https://www.incredible.co.za/api/catalog/product/s/m/sm_s931_galaxys25_front_navy_ecommerce_3bb6.png?width=808&height=538&store=incredibleconnection&image-type=image" alt="Samsung Galaxy S25">
      <h2 class="card__name">Samsung Galaxy S25</h2>
      <p class="card__price">R19 999</p>
      <button class="btn" type="button">Add to Cart</button>
    </article>

    <article class="card">
      <img class="card__image" src="https://www.incredible.co.za/api/catalog/product/s/m/sm_f966_zfold7_openback115_blue_shadow_250425_ecommerce_a2c9.png?width=808&height=538&store=incredibleconnection&image-type=image" alt="Samsung Galaxy Z Fold7">
      <h2 class="card__name">Samsung Galaxy Z Fold7</h2>
      <p class="card__price">R44 999</p>
      <button class="btn" type="button">Add to Cart</button>
    </article>

    <article class="card">
      <img class="card__image" src="https://www.technomobi.co.za/cdn/shop/files/samsung-galaxy-z-flip8-256gb-5g-graphite-725.jpg?v=1785238691&width=750" alt="Samsung Galaxy Z Flip7">
      <h2 class="card__name">Samsung Galaxy Z Flip7</h2>
      <p class="card__price">R24 999</p>
      <button class="btn" type="button">Add to Cart</button>
    </article>

    <article class="card">
      <img class="card__image" src="https://connecteddevices.co.za/cdn/shop/files/a56_blk_front_1400x1400.jpg?v=1750935612" alt="Samsung Galaxy A56">
      <h2 class="card__name">Samsung Galaxy A56</h2>
      <p class="card__price">R9 999</p>
      <button class="btn" type="button">Add to Cart</button>
    </article>

    <article class="card">
      <img class="card__image" src="https://www.incredible.co.za/api/catalog/product/s/m/sm_a165f_galaxy_a16_lte_black_front_decal_ecommerce_09a7.png?width=808&height=538&store=incredibleconnection&image-type=image" alt="Samsung Galaxy A16">
      <h2 class="card__name">Samsung Galaxy A16</h2>
      <p class="card__price">R3 799</p>
      <button class="btn" type="button">Add to Cart</button>

    </article>


  </main>


</body>


</html
